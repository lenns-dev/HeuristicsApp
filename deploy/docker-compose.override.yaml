services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - web
    networks:
      - aspire

  web:
    restart: always
    ports: !reset []

  api:
    restart: always
    volumes:
      - warehouse-instances:/app/WarehouseInstances

  compose-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest # Fijar version
    ports: !override
      - "127.0.0.1:8080:18888"

volumes:
  warehouse-instances:
